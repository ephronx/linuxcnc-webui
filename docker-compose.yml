services:
  webui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: linuxcnc-webui-dev
    container_name: linuxcnc-webui-dev
    ports:
      - "8090:8090"
    volumes:
      # Bind-mount source so host edits are reflected immediately.
      # Frontend changes: browser refresh.
      # Server changes: `docker compose restart webui`.
      - ./server:/app/server
      - ./frontend:/app/frontend
      - ./linuxcnc_webui.py:/app/linuxcnc_webui.py
      - ./nc_files:/app/nc_files
    restart: unless-stopped
